services:
  - type: web
    name: dino-evolution
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /stats
    envVars:
      - key: DATABASE_URL     # строка подключения Neon (postgres://...?sslmode=require)
        sync: false
      - key: ADMINS           # ники админов через запятую
        value: ""
