import * as THREE from 'three';

const root = objs[0];
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x7a9ab0); sc.add(root);
const gr = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x6b8a4a })); gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true; sc.add(gr);
sc.add(new THREE.HemisphereLight(0xdfefff, 0x556644, 1.2)); const dl = new THREE.DirectionalLight(0xfff4e0, 2.6); dl.position.set(4, 8, 5); dl.castShadow = true; sc.add(dl);

// анимация
const an = gl.animations.find((a) => a.name === q.get('clip'));
const mixer = new THREE.AnimationMixer(root);
if (an) { const tracks = an.channels.map((c) => { const s = an.samplers[c.sampler], o = objs[c.target.node], path = c.target.path; const T = path === 'rotation' ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack; return new T(o.uuid + '.' + ({ rotation: 'quaternion', translation: 'position', scale: 'scale' })[path], Array.from(acc(s.input)), Array.from(acc(s.output))); });

const views = JSON.parse(q.get('views') || '[[8,1.2,0,0,0.8,-0.6],[-8,1.2,0,0,0.8,-0.6],[0.01,1.5,8,0,0.8,0],[0.01,1.5,-8,0,0.8,0],[0.01,9,0.01,0,0,-0.6],[5,2.5,5,0,0.7,-0.4]]');

window.__info = JSON.stringify({ anims: gl.animations.map((a) => a.name), prims: gl.meshes[0].primitives.length, joints: skin.joints.length });
